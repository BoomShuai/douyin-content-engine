[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-content-engine"
version = "1.0.0"
description = "Local comment research workbench with reviewable evidence and optional local sarcasm models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==4.57.6", "safetensors==0.7.0", "numpy==2.0.2"]

[project.scripts]
douyin-content-engine = "douyin_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["douyin_engine*"]

[tool.setuptools.package-data]
douyin_engine = ["data/*.json", "web/*.html", "web/*.js", "web/*.css"]
