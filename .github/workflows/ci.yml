name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node scripts/test_frontend.cjs
      - run: python scripts/privacy_check.py --history
      - run: python -m pip install .
      - run: python -I scripts/smoke_installed.py
      - run: python scripts/build_release.py --output dist/source.zip --source-date-epoch 1788134400
      - run: python scripts/verify_release.py dist/source.zip
